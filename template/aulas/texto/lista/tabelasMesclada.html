<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Mescladas</title>
</head>
<body>
    
    <table border="1">

        <thead>
            <tr>
                <th colspan="3">Lista de Filmes</th>
            </tr>
            <tr>
                <th>Gênero</th>
                <th>Filme</th>
                <th>Ano</th>
                <th>Nota</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Drama</td>
                <td>O poderoso chefão</td>
                <td>1972</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Velozes</td>
                <td>2004</td>
                <td>9</td>
            </tr>
            <tr>
                <td rowspan="3">Terror</td>
                <td>Todo mundo em pânico</td>
                <td>2026</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Invocação do Mal</td>
                <td>2003</td>
                <td>7</td>
            </tr>
            <tr>
                <td>Sexta-feira 13</td>
                <td>2001</td>
                <td>9.0</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
