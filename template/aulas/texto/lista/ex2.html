<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Mescladas</title>
    <link rel="stylesheet" href="./css/tabelasMescladas.css">
</head>
<body>
    <table border="1">
        <thead>
        <tr>        
            <th colspan="4">Festival de Cinema 2026</th>
        </tr>
        <tr>
            <th id="cabecario">Categoria</th>
            <th id="cabecario">Filme</th>
            <th id="cabecario">Horário</th>
            <th id="cabecario">Sala</th>
        </tr>
        </thead>

        <tbody>
            <tr>
                <td class="genero", rowspan="2">Ação</td>
                <td> Vingadores</td>
                <td>18:00</td>
                <td>1</td>
            </tr>
            <tr>
                <td>Batman</td>
                <td>20:30</td>
                <td>2</td>
            </tr>
            <tr>
                <td class="genero", rowspan="2">Animação</td>
                <td>Toy Story</td>
                <td>16:00</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Frozen</td>
                <td>16:00</td>
                <td>4</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
